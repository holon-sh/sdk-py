name: CI
on:
  pull_request:
  workflow_dispatch:
  # publish-dev.yml runs this first on every merge to main.
  workflow_call:
    inputs:
      version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run --no-sync pytest
      - run: uv run --no-sync mypy --strict -p holon
      - name: Set the package version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: uv version --frozen "$VERSION"
      - run: uv build
      - name: Verify installed wheel and sdist consumers
        run: uv run --no-sync python scripts/verify_distribution.py
      - uses: actions/checkout@v4
        with:
          repository: holon-sh/cli
          ref: b46bc5980faf8d9a6b4ab19243371466a31daf75
          path: .cli
      - uses: actions/setup-go@v7
        with:
          go-version-file: .cli/go.mod
          cache-dependency-path: .cli/go.sum
      - name: Verify generated clients against the wheel and sdist
        run: |
          for package in dist/*.whl dist/*.tar.gz; do
            .cli/scripts/test-sdk-consumers python "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: holon-sh
          path: dist/
