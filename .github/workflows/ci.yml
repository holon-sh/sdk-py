name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run --no-sync pytest
      - run: uv run --no-sync mypy --strict -p holon.client -p holon.binding
      - run: uv build
      - name: Verify installed wheel and sdist consumers
        run: uv run --no-sync python scripts/verify_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: holon-sh
          path: dist/
