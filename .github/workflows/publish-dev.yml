# Every merge to main publishes a dev build, 0.0.1.dev<run number>. PyPI trusts this workflow by
# name to publish. While every holon-sh release is a dev build, installers take the newest one
# without asking for pre-releases.
name: Publish dev release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: 0.0.1.dev${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Set the dev version (not committed)
        run: uv version --frozen "$VERSION"
      - run: uv build
      - run: uv publish --trusted-publishing always dist/*
