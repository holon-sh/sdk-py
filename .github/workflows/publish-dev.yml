# Every merge to main publishes a dev build, 0.0.1.dev<run number>. PyPI trusts this workflow by
# name to publish. While every holon-sh release is a dev build, installers take the newest one
# without asking for pre-releases.
name: Publish dev release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: 0.0.1.dev${{ github.run_number }}
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: holon-sh
          path: dist
      - run: uv publish --trusted-publishing always dist/*
