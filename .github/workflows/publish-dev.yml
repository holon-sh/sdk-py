name: Publish dev release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (only "dev" is supported)
        type: string
        default: dev

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: 0.0.1.dev${{ github.run_number }}
    steps:
      - name: Validate channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" != dev ]; then
            echo "::error::Unsupported channel '$CHANNEL'; only 'dev' can be published from this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run --no-sync pytest
      - run: uv run --no-sync mypy --strict -p holon.client -p holon.binding
      - name: Set the dev version (not committed)
        run: |
          uv version --frozen "$VERSION"
          grep -q "^version = \"$VERSION\"$" pyproject.toml
      - run: uv build
      - name: Verify installed wheel and sdist consumers
        run: uv run --no-sync python scripts/verify_distribution.py
      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            export UV_PUBLISH_TOKEN="$PYPI_TOKEN"
          fi
          uv publish --trusted-publishing automatic dist/*
      - name: Summarize
        run: |
          {
            echo "## holon-sh $VERSION (dev)"
            echo
            echo '```sh'
            echo "pip install holon-sh==$VERSION"
            echo "uv add 'holon-sh==$VERSION'"
            echo "pip install --pre holon-sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
