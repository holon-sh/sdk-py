[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "holon-sh"
version = "0.1.0"
description = "Typed MCP clients, bindings, app views, and static contract extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
check = ["mcptype==0.0.6", "mypy==2.4.0"]

[project.urls]
Repository = "https://github.com/holon-sh/sdk-py"

[tool.hatch.build.targets.wheel]
only-include = ["holon"]

[tool.hatch.build.targets.sdist]
include = ["holon", "tests", "scripts", "runner.py", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "types-jsonschema", "hatchling>=1.27,<2"]
